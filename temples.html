<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta Tags -->
    <meta name="description" content="A responsive temple album gallery showcasing beautiful temple images with navigation and mobile-friendly design.">

    <meta name="author" content="Jesam Onen">

    <title>Temple Album</title>

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- CSS Files (mobile-first) -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <!-- JavaScript (deferred for proper loading) -->
    <script src="scripts/temples.js" defer></script>
</head>

<body>

<header>
    <h1>Temple Album</h1>

    <!-- Hamburger Button -->
    <button id="menuBtn" aria-label="Toggle navigation">☰</button>

    <nav id="navMenu">
        <a href="#">Home</a>
        <a href="#">Old</a>
        <a href="#">New</a>
        <a href="#">Large</a>
        <a href="#">Small</a>
    </nav>
</header>

<main>
    <h2>Temples Gallery</h2>

    <section class="grid">

        <figure>
            <img src="images/temple1.jpg" alt="Temple 1">
            <figcaption>Temple 1</figcaption>
        </figure>

        <figure>
            <img src="images/temple2.jpg" alt="Temple 2">
            <figcaption>Temple 2</figcaption>
        </figure>

        <figure>
            <img src="images/temple3.jpg" alt="Temple 3">
            <figcaption>Temple 3</figcaption>
        </figure>

        <figure>
            <img src="images/temple4.jpg" alt="Temple 4">
            <figcaption>Temple 4</figcaption>
        </figure>

        <figure>
            <img src="images/temple5.jpg" alt="Temple 5">
            <figcaption>Temple 5</figcaption>
        </figure>

        <figure>
            <img src="images/temple6.jpg" alt="Temple 6">
            <figcaption>Temple 6</figcaption>
        </figure>

        <figure>
            <img src="images/temple7.jpg" alt="Temple 7">
            <figcaption>Temple 7</figcaption>
        </figure>

        <figure>
            <img src="images/temple8.jpg" alt="Temple 8">
            <figcaption>Temple 8</figcaption>
        </figure>

        <figure>
            <img src="images/temple9.jpg" alt="Temple 9">
            <figcaption>Temple 9</figcaption>
        </figure>

    </section>
</main>

<footer>
    <p>&copy; <span id="year"></span> Temple Album</p>
    <p>Last Modified: <span id="lastModified"></span></p>
</footer>

</body>
</html>
